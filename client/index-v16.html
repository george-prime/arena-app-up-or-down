<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bitcoin Up or Down · 15 min</title>
<!-- THE MARKET'S OWN CLIENT (kanban #237): btc-updown-15m, pinned by its manifest's clients[] and run by the Arena page in its
     frame. Laid out as Polymarket's (Daniel 2026-10-10 screenshots): the window's question and prices, "Buy Up 52¢" / "Buy
     Down 48¢", and a buy sheet - MARKET (an amount in sats, "To win") or, behind the settings icon, LIMIT (a limit price,
     shares, an expiry, Total and To win). Every order brings its own amount (order-book.js MIN_ORDER_MSAT .. MAX_ORDER_MSAT)
     and goes through the page's own join, deposit and locks (window.parent.ARENA_GAME.market.order). A share pays 1 sat if
     its side wins. The live BTC price and the price to beat are Coinbase's, for the eye; the outcome is the attestors'. -->
<style>
  :root { --bg:#0e1117; --card:#171b24; --line:#262d3b; --text:#e8edf3; --dim:#8d99a8; --up:#2fd38a; --down:#ff5a6a; --blue:#4f7cff; color-scheme:dark; }
  * { box-sizing:border-box; } html,body { margin:0; height:100%; }
  body { background:var(--bg); color:var(--text); font:15px/1.4 system-ui,-apple-system,sans-serif; display:flex; flex-direction:column;
    padding:max(10px,env(safe-area-inset-top)) 12px 10px; gap:8px; overflow:hidden; }
  button { font:inherit; color:inherit; cursor:pointer; }
  /* THE WAY BACK ON ITS OWN ROW, THE TITLE ON ITS OWN LINE (kanban #388, Daniel 2026-10-16: Rock Paper Scissors' "is easier to
     recognize and the game title looks much nicer and is separated from the navigation button ... make is consistent") */
  button.back { display:inline-flex; align-items:center; gap:6px; align-self:flex-start; background:var(--card); border:1px solid var(--line);
    border-radius:8px; padding:6px 12px; font:600 13px system-ui; color:var(--dim); cursor:pointer; }
  button.back:hover { color:#f7931a; }
  header { display:flex; align-items:center; justify-content:space-between; gap:10px; margin:10px 0 12px; }
  header h1 { font:800 22px/1.15 system-ui; letter-spacing:-0.01em; margin:0; flex:1; }
  header h1 .arrows { margin-left:8px; font-size:18px; } header h1 .up { color:#3fb950; } header h1 .down { color:#f85149; } .chip { font:700 11px system-ui; letter-spacing:.06em; padding:4px 8px; border-radius:99px; border:1px solid var(--line); color:var(--dim); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:10px 12px; }
  .q { font:700 16px system-ui; } .sub { color:var(--dim); font-size:13px; }
  .row3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; margin-top:8px; text-align:center; }
  .row3 b { display:block; font:700 16px system-ui; font-variant-numeric:tabular-nums; } .row3 span { color:var(--dim); font-size:11.5px; }
  .odds { display:flex; justify-content:space-between; align-items:baseline; margin-top:6px; } .odds b { font:800 26px system-ui; }
  .sides { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .side { border:0; border-radius:12px; padding:12px 6px; font:700 16px system-ui; }
  /* AN ORDER'S PROGRESS IN THE SHEET (version 5, kanban #438, Daniel 2026-10-17: "When I press buy up nothing happens no order no
     error. There needs to be feedback and some sort of progress indicator while we wait for the result") */
  .status { display:none; align-items:center; gap:8px; margin-top:8px; padding:9px 11px; border-radius:10px; border:1px solid var(--line); font:600 13px/1.35 system-ui; }
  .status.on { display:flex; } .status.ok { border-color:var(--up); color:var(--up); } .status.bad { border-color:var(--down); color:#ffb4ad; }
  .status .spin { flex:none; width:15px; height:15px; border-radius:50%; border:2px solid var(--line); border-top-color:#f7931a; animation:spin .8s linear infinite; }
  .status.ok .spin, .status.bad .spin { display:none; } @keyframes spin { to { transform:rotate(360deg); } }
  .r .pend { color:#f7931a; }
  /* THE DESKTOP VIEW, AS AN EXCHANGE (version 8, kanban #448, Daniel 2026-10-17: "build a real desktop view with complete order book
     bids ask, chart, depth (switchable) like an exchange. Like Polymarket is doing"): from 1000 px the window's card, the chart or
     the depth and the full order book on the left - drawn by the page (ARENA_GAME.market.exchange) - and the buy panel, my orders
     and the history on the right, beside them; a phone keeps the one column */
  .cols, .colL, .colR { display:contents; } #xv { display:none; }
  /* THE FULL MARKET VIEW ON A PHONE, BY CHOICE (version 14, kanban #461, Daniel 2026-10-17: "Also include the full market view for
     prediction markers for mobile but have a switch that has compact/advanced for mobile"): Compact is the one column as before;
     Advanced adds the exchange - the chart or the depth and the full order book - under the window's card. The choice is kept in
     this browser (arena.updown.view). A wide screen always shows the exchange and no switch */
  .vsw { display:flex; gap:4px; padding:3px; border-radius:11px; background:#11151d; border:1px solid var(--line); align-self:flex-start; }
  .vsw button { font:700 13px system-ui; padding:7px 14px; border-radius:8px; border:0; background:transparent; color:var(--dim); cursor:pointer; }
  .vsw button[aria-pressed="true"] { background:var(--card); color:var(--text); box-shadow:0 0 0 1px var(--line); }
  @media (max-width:999px) { body.adv #xv { display:flex; } }
  @media (min-width:1000px) { .vsw { display:none; } }
  @media (min-width:1000px) {
    body { max-width:1320px; margin:0 auto; width:100%; padding-left:20px; padding-right:20px; }
    .cols { display:grid; grid-template-columns:minmax(0,1fr) 390px; gap:16px; align-items:start; }
    .colL, .colR { display:flex; flex-direction:column; gap:10px; min-width:0; }
    .colR { position:sticky; top:10px; }
    #xv { display:flex; }
  }
  /* MY ORDERS AS CARDS (version 6, kanban #443, Daniel 2026-10-17: "This looks pretty bad, make it prettier and more structured"): one
     card per order - the side, the amount and the limit, the window, and where it stands - its result in the same card */
  .ords { display:flex; flex-direction:column; gap:6px; }
  .ord { display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:10px; padding:9px 10px; border-radius:11px; background:#11151d; border:1px solid var(--line); }
  .ord .sd { font:800 13px system-ui; padding:5px 9px; border-radius:8px; white-space:nowrap; }
  .ord .sd.up { color:var(--up); background:rgba(47,211,138,.12); } .ord .sd.down { color:var(--down); background:rgba(255,90,106,.12); }
  .ord .what b { font:700 14.5px system-ui; } .ord .what .lim { color:var(--dim); font-size:13px; } .ord .what .win { color:var(--dim); font-size:12px; margin-top:1px; }
  .ord .st { display:flex; flex-direction:column; align-items:flex-end; gap:4px; }
  .chip2 { font:700 11.5px system-ui; padding:3px 8px; border-radius:999px; white-space:nowrap; border:1px solid var(--line); color:var(--dim); }
  .chip2.open { color:#7aa2ff; border-color:rgba(79,124,255,.45); } .chip2.wait { color:#f7931a; border-color:rgba(247,147,26,.45); }
  .chip2.won { color:var(--up); border-color:rgba(47,211,138,.5); background:rgba(47,211,138,.08); } .chip2.lost { color:var(--down); border-color:rgba(255,90,106,.45); }
  .ord .st button { background:none; border:1px solid var(--line); border-radius:7px; padding:1px 8px; font-size:11.5px; color:var(--dim); }
  .ord.flight { border-style:dashed; }
  /* THE HISTORY (version 7, kanban #447, Daniel 2026-10-17: "also show closed orders with the history with how much you won or lost,
     and also show there if it's still pending (10 minute delay)"): open orders first, then every closed one with what it won or
     lost, the 10-minute objection window counted down until the result is final, and the totals */
  .ord .st .amt { font:800 14px system-ui; font-variant-numeric:tabular-nums; } .amt.won { color:var(--up); } .amt.lost { color:var(--down); }
  .ord .st .fin { font-size:11px; color:var(--dim); white-space:nowrap; } .ord .st .fin.pend { color:#f7931a; }
  .hist { display:flex; justify-content:space-between; align-items:baseline; gap:8px; margin:12px 0 6px; }
  /* PAST ORDERS (version 9, kanban #447, Daniel 2026-10-17: "Don't forget past orders also for the desktop view and mobile. Shows round
     (human readable name eg 18:45-19:00), result, stake, p/l"): on a phone each past order's card names its round, stake, result and
     P/L; on a desktop a table under the order book; kept in this browser, so they outlive the tab */
  .pastc { padding:9px 10px; border-radius:11px; background:#11151d; border:1px solid var(--line); }
  .pastc .ph { display:flex; align-items:center; gap:8px; } .pastc .ph .rd { flex:1; font:700 14px system-ui; white-space:nowrap; }
  .pastc .ph .sd { font:800 12.5px system-ui; padding:4px 8px; border-radius:8px; white-space:nowrap; }
  .pastc .ph .sd.up { color:var(--up); background:rgba(47,211,138,.12); } .pastc .ph .sd.down { color:var(--down); background:rgba(255,90,106,.12); }
  .pastc .ph .fin { font-size:11px; color:var(--dim); white-space:nowrap; } .pastc .ph .fin.pend { color:#f7931a; }
  .pastc .pg { display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; margin-top:7px; }
  .pastc .pg span { display:block; font-size:10.5px; color:var(--dim); text-transform:uppercase; letter-spacing:.05em; }
  .pastc .pg b { font:700 13.5px system-ui; font-variant-numeric:tabular-nums; } .pastc .pg b.won { color:var(--up); } .pastc .pg b.lost { color:var(--down); }
  .pastc .pg div:last-child { text-align:right; }
  #pastd { display:none; } table.past { width:100%; border-collapse:collapse; font:13.5px system-ui; font-variant-numeric:tabular-nums; }
  table.past th { color:var(--dim); font:600 11.5px system-ui; text-transform:uppercase; letter-spacing:.05em; text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); }
  table.past td { padding:7px 8px; border-bottom:1px solid var(--line); } table.past tr:last-child td { border:0; }
  table.past td.n, table.past th.n { text-align:right; } table.past .won { color:var(--up); font-weight:700; } table.past .lost { color:var(--down); font-weight:700; }
  table.past .up { color:var(--up); font-weight:700; } table.past .down { color:var(--down); font-weight:700; } table.past .pend { color:#f7931a; }
  @media (min-width:1000px) { #pastd { display:block; } #histhead, #hist { display:none !important; } }
  .hist h3 { margin:0 !important; }
  .tot .ts { display:none; } @media (max-width:999px) { .tot .tl { display:none; } .tot .ts { display:inline; white-space:nowrap; } } .tot { font:600 12px system-ui; color:var(--dim); text-align:right; } .tot b.won { color:var(--up); } .tot b.lost { color:var(--down); }
  .side.up { background:#12301f; color:var(--up); } .side.down { background:#3a1216; color:#ff8a94; }
  .side.on.up { outline:2px solid var(--up); } .side.on.down { outline:2px solid var(--down); }
  .sheet { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:12px; position:relative; }
  .sheet .top { display:flex; justify-content:space-between; align-items:center; }
  .pill { background:#232937; border-radius:99px; padding:5px 14px; font-weight:600; }
  .gear { background:none; border:0; font-size:20px; padding:2px 6px; }
  .menu { position:absolute; right:12px; top:44px; background:#1d222d; border:1px solid var(--line); border-radius:12px; padding:4px 0; z-index:5; display:none; min-width:130px; }
  .menu.open { display:block; } .menu button { display:block; width:100%; text-align:left; background:none; border:0; padding:9px 14px; }
  .menu button.on { color:var(--blue); font-weight:700; }
  .amount { text-align:center; font:800 42px system-ui; margin:6px 0 0; font-variant-numeric:tabular-nums; }
  .amount input { width:100%; text-align:center; background:none; border:0; color:var(--text); font:inherit; outline:none; }
  /* LESS AND MORE (version 12, kanban #456, Daniel 2026-10-17: "This amount is pretty bad on mobile, can only increase but never
     increase. Include plus minus buttons to make it easier, and default to 100 Sats. It saves the last user amount in local storage
     and loads it again"): − and + beside the amount, a step that grows with it; 100 sats unless this browser kept another */
  .amount { display:flex; align-items:center; justify-content:center; gap:10px; }
  .amount input { flex:1; min-width:0; }
  .amount .step { flex:none; width:46px; height:46px; border:0; border-radius:12px; background:#2a3040; color:var(--text); font:700 26px/1 system-ui; }
  .amount .step:active { background:#38415a; }
  .center { text-align:center; } .win { color:var(--up); font-weight:800; }
  .chips { display:flex; gap:6px; justify-content:center; flex-wrap:wrap; margin:6px 0; }
  .chips button { background:#2a3040; border:0; border-radius:10px; padding:6px 11px; font-weight:600; }
  .line { display:flex; justify-content:space-between; align-items:center; padding:6px 0; border-top:1px solid var(--line); }
  .line input, .line select { width:7.5em; text-align:right; background:var(--bg); border:1px solid var(--line); border-radius:10px; color:var(--text); padding:7px; font:600 16px system-ui; }
  .stepper { display:flex; gap:4px; align-items:center; } .stepper button { background:#2a3040; border:0; border-radius:8px; width:30px; height:32px; }
  .total { font:700 18px system-ui; color:var(--blue); } .bigwin { font:800 22px system-ui; color:var(--up); }
  .go { width:100%; padding:13px; border:0; border-radius:12px; background:var(--blue); color:#fff; font:800 16px system-ui; margin-top:8px; }
  .go:disabled { opacity:.45; } .err { color:var(--down); font-size:13px; min-height:1em; text-align:center; }
  .list { flex:1; min-height:0; overflow:auto; } .list h3 { margin:0 0 4px; font:700 12px system-ui; color:var(--dim); text-transform:uppercase; letter-spacing:.06em; }
  .r { display:flex; justify-content:space-between; gap:8px; padding:5px 0; border-bottom:1px solid var(--line); font-size:13.5px; } .r:last-child { border:0; }
  .r button { background:none; border:1px solid var(--line); border-radius:8px; padding:2px 8px; font-size:12px; }
  a { color:#7cc4ff; } .none { color:var(--dim); text-align:center; padding:30px 10px; } [hidden] { display:none !important; }
</style></head><body>
<button class="back" type="button" id="back" title="Back to Bitcoin Arena">&larr; Arena</button>
<header><h1>Bitcoin Up or Down<span class="arrows" aria-hidden="true"><span class="up">&#9650;</span><span class="down">&#9660;</span></span></h1><span id="kind-host" style="display:contents"></span></header>
<div id="view" style="display:contents"></div>

<script>
const A = window.parent && window.parent.ARENA_GAME;
const $ = (id) => document.getElementById(id);
const SCALE = 100000, TICK = 1000, PERIOD_MS = 15 * 60000;
const MIN_SHARES = 5, FEE_BPS = 100, MIN_SAT = 1, MAX_SAT = 100000;   // the book's minimum shares; 1 % fee; order-book.js limits
const usd = (c) => (c === null || c === undefined ? '…' : '$' + (c / 100).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }));
const sats = (n) => Math.floor(n).toLocaleString('en-US') + ' sats';
const hhmm = (ms) => new Date(ms).toISOString().slice(11, 16);
const mmss = (ms) => { const s = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
// <history> WHAT AN ORDER CAME TO, AND THE PAST ORDERS KEPT (version 10, kanban #450: one block with no page, no storage and no clock
// of its own - packages/arena-node/test/updown-client-history.test.js runs it as it stands here): an order `o` (round, entry, pick,
// stake, limit, close, cancelled) and the page's line `l` for it (state won / lost / refunded / void / disputed / settled /
// unverified / unknown / open, gain or loss, final, finalAtMs)
const HISTORY = (() => {
  const PERIOD = 15 * 60000, MAX = 200, TICK_ = 1000;
  const CLOSED = ['won', 'lost', 'refunded', 'void', 'disputed', 'right', 'wrong', 'settled'];
  const satOf = (msat) => Math.floor(Number(msat) / 1000).toLocaleString('en-US') + ' sats';
  const clock = (ms) => { const s = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
  const hm = (ms) => new Date(ms).toISOString().slice(11, 16);
  const signed = (msat, sign) => (sign < 0 ? '−' : '+') + satOf(msat);
  /** The round by its day and window, as a person reads it: "17 Oct · 18:45–19:00 UTC" (version 15, Daniel 2026-10-20: "In the history
   *  and pending always display the date of the bet"). */
  const dayOf = (ms) => { const d = new Date(ms); return d.getUTCDate() + ' ' + ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][d.getUTCMonth()]; };
  const roundOf = (closeMs) => dayOf(closeMs - PERIOD) + ' · ' + hm(closeMs - PERIOD) + '–' + hm(closeMs) + ' UTC';
  /** Closed: cancelled, or the line has a result. A line with no result (open, unknown - a pick not in the seats' table yet,
   *  unverified) keeps the order open, "waiting for the result". */
  const isClosed = (o, l) => !!o.cancelled || !!(l && CLOSED.includes(l.state));
  /** [chip class, chip text, amount, its class, msat gained (+) or lost (−)] */
  function resultOf(o, l, now) {
    if (o.cancelled) return ['', 'cancelled', '', '', 0];
    const st = l && l.state;
    if (st === 'won') return ['won', 'won', signed(l.gainMsat, 1), 'won', Number(l.gainMsat)];
    if (st === 'lost') return ['lost', 'lost', signed(l.lostMsat, -1), 'lost', -Number(l.lostMsat)];
    if (st === 'settled') { const d = Number(l.payoutMsat) - Number(l.netMsat); return [d >= 0 ? 'won' : 'lost', 'paid ' + satOf(l.payoutMsat), signed(Math.abs(d), d), d >= 0 ? 'won' : 'lost', d]; }
    if (st === 'refunded' || st === 'void') return ['', 'refunded', '±0', '', 0];
    if (st === 'disputed') return ['', 'refunded at expiry', '±0', '', 0];
    if (st === 'right' || st === 'wrong') return [st === 'right' ? 'won' : 'lost', st === 'right' ? 'right' : 'wrong', 'free', '', 0];
    if (st === 'unverified') return ['wait', 'result unverified', '', '', 0];
    if (o.entryCloseMs > now) return ['open', 'closes in ' + clock(o.entryCloseMs - now), '', '', 0];
    return ['wait', 'waiting for the result', '', '', 0];
  }
  /** The past orders: the kept ones (this browser's), each closed live one over its kept summary, newest round first, at most 200. */
  function merge(kept, closed, now) {
    const byEntry = new Map((Array.isArray(kept) ? kept : []).filter((x) => x && x.entry).map((x) => [x.entry, x]));
    for (const { o, l } of closed) {
      byEntry.set(o.entry, { entry: o.entry, closeMs: Number(o.entryCloseMs), side: Number(o.pick), stakeMsat: Number(o.stakeMsat), limit: Math.round(o.limitPrice / TICK_),
        state: o.cancelled ? 'cancelled' : (l && l.state) || '', pnlMsat: resultOf(o, l, now)[4], final: l ? l.final : undefined, finalAtMs: l ? l.finalAtMs : undefined });
    }
    return [...byEntry.values()].sort((x, y) => y.closeMs - x.closeMs || (x.entry < y.entry ? -1 : 1)).slice(0, MAX);
  }
  const resultLine = (p, outcomes) => p.state === 'won' ? `${outcomes[p.side]} won` : p.state === 'lost' ? `${outcomes[1 - p.side]} won`
    : p.state === 'refunded' || p.state === 'void' ? 'refunded' : p.state === 'disputed' ? 'disputed · refunded' : p.state === 'cancelled' ? 'cancelled' : p.state || '–';
  const plLine = (p) => (p.pnlMsat > 0 ? '+' + satOf(p.pnlMsat) : p.pnlMsat < 0 ? '−' + satOf(-p.pnlMsat) : '±0');
  const plCls = (p) => (p.pnlMsat > 0 ? 'won' : p.pnlMsat < 0 ? 'lost' : '');
  /** Final: the seats said so, or its objection window has passed (a kept order read after a reload); a cancel is final at once. */
  const isFinal = (p, now) => p.final === true || (!!p.finalAtMs && now >= p.finalAtMs) || p.state === 'cancelled';
  const statusLine = (p, now) => (isFinal(p, now) ? 'final' : p.finalAtMs ? 'pending · final in ' + clock(p.finalAtMs - now) : 'pending');
  return { MAX, CLOSED, roundOf, isClosed, resultOf, merge, resultLine, plLine, plCls, isFinal, statusLine };
})();
// </history>

// EVERYTHING ON THE SCREEN IS REACT'S (version 16): the view (view/UpDownView.jsx, inlined above) is handed one view model at every draw
// and every press and keystroke comes back through `on`; this script keeps the market - its rows, the book, the prices, the orders and
// what the sheet asks - as version 15 did
const VIEW = window.UpDownView.mount($('view'), $('kind-host'));
VIEW.kind('…');
if (!A || !A.market) {
  VIEW.draw({ outside: true });
} else {
  window.UPDOWN_CLIENT = { hash: A.clientHash, game: A.game.id, state: {} };
  // this client says its orders' progress itself: the page's strip over it stays away
  try { window.parent.ARENA_CLIENT_SAYS_JOIN = true; } catch {}
  $('back').onclick = () => A.back();
  const outcomes = A.game.outcomes.length ? A.game.outcomes : ['Up', 'Down'];
  // THE FEE AS THE MARKET'S TERMS NAME IT (version 13): the page hands the chosen version's terms (ARENA_GAME.game.fees)
  const fee = (() => {
    const F = A.game.fees, pc = (b) => `${(b / 100).toLocaleString('en-US', { maximumFractionDigits: 2 })} %`;
    if (F && Number.isInteger(F.node) && Number.isInteger(F.donation)) return `Fee ${pc(F.node + F.donation)}: ${pc(F.node)} nodes + ${pc(F.donation - (F.reserve || 0))} donation`
      + `${F.reserve ? ` + ${pc(F.reserve)} protocol reserve` : ''}, due when the market resolves; all back if it is void.`;
    return 'Fee 1 %: 0.5 % nodes + 0.5 % donation, due when the market resolves; all back if it is void.';
  })();
  let pick = 0, mode = 'market', current = null, book = null, live = { now: null, beat: null, beatFor: null };
  // THE SHEET'S FIELDS, kept here: the view shows them and hands every keystroke back
  const form = { amt: '100', lp: '50', sh: '100', exp: '0' };
  let menuOpen = false, said = '', adv = false, xv = null, xvEl = null;
  const cancelling = new Set();
  // the window's card as last read: kept when no window is open
  let card = { kind: '…', q: '…', left: '', poly: null, beat: '…', now: '…', delta: { text: '…', color: '' } };
  // THE WINDOW AN ORDER CAN JOIN (version 5): the soonest joinable one, else the soonest open one
  const windowNow = () => {
    const open = (A.allRows ? A.allRows() : A.rows()).filter((r) => r.entryCloseMs && r.entryCloseMs > Date.now()).sort((x, y) => x.entryCloseMs - y.entryCloseMs);
    return open.find((r) => r.joinable) || open[0] || null;
  };
  // THE ORDER IN FLIGHT: the page's join and the pick it carries, said in the sheet and in My orders until the order is the page's
  let placing = null;
  function joinStatus() {
    const j = A.state().join;
    if (!j || !placing || j.round !== placing.round) return null;
    let line, cls = '';
    const st = String(j.stage || ''), starts = /round starts in ([0-9:]+)/.exec(st);
    if (j.state === 'refused') { line = 'Order not placed: ' + (j.why || 'refused'); cls = 'bad'; }
    else if (j.state === 'joining' && starts) { line = '✓ Order locked · the window starts in ' + starts[1]; cls = 'ok'; }
    else if (j.state === 'joining') { line = 'Placing your order … ' + (/^stake lock/.test(st) ? 'locking your stake in the federation' : (st || 'asking the round\'s seats')); }
    else { line = '✓ Order placed'; cls = 'ok'; }
    if (cls && !placing.doneAt) placing.doneAt = Date.now();
    if (!cls) placing.doneAt = 0;
    if (placing.doneAt && Date.now() - placing.doneAt > (cls === 'bad' ? 20000 : 10000) && !starts) { placing = null; return null; }
    return { state: j.state, line, cls };
  }
  // THE PRICE OF UP: the last certified batch's, else 50¢; Down is 1 less it
  const upCents = () => { const b = book && book.batches ? book.batches.filter((x) => x.price) : []; return b.length ? Math.round(Number(b[b.length - 1].price) / TICK) : 50; };
  const priceOf = (i) => (i === 0 ? upCents() : 100 - upCents());
  const net = (s) => s * (1 - FEE_BPS / 10000);
  async function prices() {
    try { const j = await (await fetch('https://api.coinbase.com/v2/prices/BTC-USD/spot', { cache: 'no-store' })).json(); live.now = Math.round(Number(j.data.amount) * 100); } catch {}
    if (current && live.beatFor !== current.id && Date.now() >= current.entryCloseMs - PERIOD_MS) {
      try {
        const start = current.entryCloseMs - PERIOD_MS, iso = (ms) => new Date(ms).toISOString();
        const c = await (await fetch(`https://api.exchange.coinbase.com/products/BTC-USD/candles?granularity=60&start=${iso(start - 60000)}&end=${iso(start)}`)).json();
        const before = c.filter((x) => x[0] * 1000 < start).sort((a, b) => b[0] - a[0])[0];
        if (before) { live.beat = Math.round(before[4] * 100); live.beatFor = current.id; }
      } catch {}
    }
    draw();
  }
  async function readBook() { if (current) { try { book = await A.market.book(current.id); } catch { book = null; } } draw(); }
  // WHAT THE SHEET ASKS: { stakeSat, limitCents, expiryMs, shares, win } or why not
  function asked() {
    if (mode === 'market') {
      const amt = Math.floor(Number(form.amt));
      const p = Math.min(99, priceOf(pick) + 10);               // a market order: at most 10¢ over the price now, filled at the batch's
      if (!(amt >= MIN_SAT && amt <= MAX_SAT)) return { why: `an amount of ${MIN_SAT} to ${MAX_SAT.toLocaleString('en-US')} sats` };
      const shares = Math.floor(net(amt) / (priceOf(pick) / 100));
      if (Math.floor(net(amt) / (p / 100)) < MIN_SHARES) return { why: `at this price an order is at least ${Math.ceil(MIN_SHARES * p / 100 / (1 - FEE_BPS / 10000))} sats` };
      // A MARKET ORDER DOES NOT REST: what its first batches do not fill expires 60 s on and comes back at settlement
      return { stakeSat: amt, limitCents: p, expiryMs: Date.now() + 60000, shares, win: shares };
    }
    const lp = Math.floor(Number(form.lp)), sh = Math.floor(Number(form.sh));
    if (!(lp >= 1 && lp <= 99)) return { why: 'a limit price of 1 to 99¢' };
    if (!(sh >= MIN_SHARES)) return { why: `at least ${MIN_SHARES} shares` };
    const stakeSat = Math.ceil(sh * lp / 100 / (1 - FEE_BPS / 10000));
    if (stakeSat > MAX_SAT) return { why: `at most ${MAX_SAT.toLocaleString('en-US')} sats an order` };
    const e = Number(form.exp);
    return { stakeSat, limitCents: lp, expiryMs: e ? Date.now() + e : 0, shares: sh, win: sh, total: sh * lp / 100 };
  }
  const PAST_KEY = 'arena.updown.past.v1';
  function draw() {
    current = windowNow();
    const now = Date.now();
    if (current) {
      const start = current.entryCloseMs - PERIOD_MS;
      const d = live.now !== null && live.beat !== null && now >= start ? live.now - live.beat : null;
      card = { kind: current.free ? 'FREE' : 'PAID', q: `BTC up or down, ${hhmm(start)}–${hhmm(current.entryCloseMs)} UTC?`,
        left: (now < start ? 'opens in ' + mmss(start - now) + ', ' : '') + 'closes in ' + mmss(current.entryCloseMs - now),
        poly: 'https://polymarket.com/event/btc-updown-15m-' + Math.floor(start / 1000), beat: now < start ? 'at ' + hhmm(start) : usd(live.beat), now: usd(live.now),
        delta: { text: d === null ? '–' : (d >= 0 ? '▲ ' : '▼ ') + usd(Math.abs(d)), color: d === null ? '' : d >= 0 ? 'var(--up)' : 'var(--down)' } };
    } else card = { ...card, q: 'No window is open on these nodes right now.' };
    const a = asked();
    const js = joinStatus();
    // MY ORDERS: one card per order, its result in it - the order (side, amount, limit, window) and the page's line for its entry
    const mine = A.market.orders();
    const lines = (A.state().picks || []).filter((l) => l && l.text);
    const lineOf = (o) => lines.find((l) => l.entry && l.entry === o.entry) || lines.find((l) => l.round === o.round && Number(l.pick) === Number(o.pick));
    const win = HISTORY.roundOf;
    const satsOf = (msat) => sats(Number(msat) / 1000);
    const flight = placing && js && !mine.some((o) => o.round === placing.round && o.placedMs >= placing.at - 1000)
      ? { key: 'flight', side: placing.pick, amount: sats(placing.stakeSat), limit: placing.limitCents, window: win(placing.entryCloseMs), cancel: null, cls: ' flight',
        chip: js.cls === 'bad' ? ['lost', 'not placed'] : js.cls ? ['open', js.line.includes('locked') ? 'locked' : 'placed'] : ['wait', 'placing…'] } : null;
    const rows = mine.map((o) => ({ o, l: lineOf(o) })).reverse();
    const isClosed = ({ o, l }) => HISTORY.isClosed(o, l);
    const open = rows.filter((r) => !isClosed(r)), closed = rows.filter(isClosed);
    const openCards = open.map(({ o, l }) => {
      const canCancel = !o.cancelled && o.entryCloseMs > Date.now() && !(l && l.state && l.state !== 'open');
      return { key: o.entry, side: Number(o.pick), amount: satsOf(o.stakeMsat), limit: Math.round(o.limitPrice / TICK), window: win(o.entryCloseMs),
        chip: HISTORY.resultOf(o, l, now), cancel: canCancel ? { entry: o.entry, busy: cancelling.has(o.entry) } : null };
    });
    // PAST ORDERS, KEPT IN THIS BROWSER (version 9): each closed order's summary - no key, no secret - merged with the tab's live ones
    let kept = []; try { kept = JSON.parse(window.localStorage.getItem(PAST_KEY) || '[]'); } catch { kept = []; }
    const past = HISTORY.merge(kept, closed, now);
    try { window.localStorage.setItem(PAST_KEY, JSON.stringify(past)); } catch { /* private window: this tab's only */ }
    const resultLine = (p) => HISTORY.resultLine(p, outcomes), isFinal = (p) => HISTORY.isFinal(p, now), statusLine = (p) => HISTORY.statusLine(p, now);
    const pastRows = past.map((p) => ({ entry: p.entry, side: p.side, window: win(p.closeMs), final: isFinal(p), status: statusLine(p), stake: satsOf(p.stakeMsat),
      limit: p.limit, result: resultLine(p), pl: HISTORY.plLine(p), plCls: HISTORY.plCls(p) }));
    const won = past.reduce((t, p) => t + (p.pnlMsat > 0 ? p.pnlMsat : 0), 0);
    const lost = past.reduce((t, p) => t + (p.pnlMsat < 0 ? -p.pnlMsat : 0), 0);
    const num = (msat) => Math.floor(Math.abs(Number(msat)) / 1000).toLocaleString('en-US');
    const totals = { count: past.length, won: satsOf(won), lost: satsOf(lost), net: satsOf(Math.abs(won - lost)), netMsat: won - lost,
      wonNum: num(won), lostNum: num(lost), netNum: num(won - lost), pend: past.filter((p) => !isFinal(p)).length };
    VIEW.kind(card.kind);
    VIEW.draw({ outcomes, view: adv ? 'advanced' : 'compact', ...card, chance: upCents() + '%', prices: [priceOf(0) + '¢', priceOf(1) + '¢'], pick, sideName: outcomes[pick],
      mode, modeLabel: 'Buy · ' + (mode === 'market' ? 'Market' : 'Limit'), menuOpen, form: { ...form },
      mwin: a.why ? '–' : sats(a.win), mprice: a.why ? '' : 'at ' + priceOf(pick) + '¢', ltotal: a.why ? '–' : sats(a.stakeSat), lwin: a.why ? '–' : sats(a.win),
      err: current && current.free ? 'Orders need a paid round' : (a.why || said),
      go: { disabled: !current || !!a.why || current.free || !!(js && js.state === 'joining' && !js.cls), text: 'Buy ' + outcomes[pick] },
      status: js ? { line: js.line, cls: js.cls } : null, fee,
      flight, open: openCards, mineEmpty: open.length || flight ? null : closed.length ? 'No open orders.' : 'No orders yet. Pick Up or Down and buy: your orders and their results show here.',
      past: pastRows, totals }, on);
    window.UPDOWN_CLIENT.history = past.map((p) => ({ entry: p.entry, round: win(p.closeMs), side: outcomes[p.side], stake: satsOf(p.stakeMsat), result: resultLine(p), pl: HISTORY.plLine(p), status: statusLine(p), final: isFinal(p), finalAtMs: p.finalAtMs }));
    window.UPDOWN_CLIENT.status = js;
    if (current) window.UPDOWN_CLIENT.state = { round: current.id, free: current.free, window: [current.entryCloseMs - PERIOD_MS, current.entryCloseMs], beat: live.beat, now: live.now, pick, mode, asked: a, orders: mine.length, upCents: upCents() };
  }
  // THE AMOUNT KEPT (version 12): the last one set, in this browser, read back on the next visit; 100 sats else
  const AMOUNT_KEY = 'arena.updown.amount';
  const keepAmount = () => { try { const v = Math.floor(Number(form.amt)); if (v >= MIN_SAT && v <= MAX_SAT) window.localStorage.setItem(AMOUNT_KEY, String(v)); } catch { /* this visit only */ } };
  try { const k = Math.floor(Number(window.localStorage.getItem(AMOUNT_KEY))); if (k >= MIN_SAT && k <= MAX_SAT) form.amt = String(k); } catch { /* 100 */ }
  // − AND +: a step that grows with the amount - 10 below 100, 100 below 1,000, 1,000 below 10,000, 10,000 above; − takes the step of
  // the amount just below, so 100 goes to 90 and 1,000 to 900
  const stepAt = (v) => (v < 100 ? 10 : v < 1000 ? 100 : v < 10000 ? 1000 : 10000);
  // THE EXCHANGE, ON A WIDE SCREEN OR IN ADVANCED: mounted into its host once, a tapped level fills a limit order on that side at that price
  const wide = window.matchMedia('(min-width:1000px)');
  const VIEW_KEY = 'arena.updown.view';
  try { adv = localStorage.getItem(VIEW_KEY) === 'advanced'; } catch { adv = false; }
  const mountXv = () => {
    if (xv || !xvEl || !(wide.matches || adv) || typeof A.market.exchange !== 'function') return;
    xv = A.market.exchange(xvEl, { round: () => current && current.id, label: (side) => 'Chance of ' + outcomes[side],
      onPrice: (cents, side) => { pick = side; mode = 'limit'; form.lp = String(Math.min(99, Math.max(1, cents))); draw(); } });
    window.UPDOWN_CLIENT.exchange = xv;
  };
  const setView = (v) => {
    adv = v === 'advanced';
    document.body.classList.toggle('adv', adv);
    try { localStorage.setItem(VIEW_KEY, adv ? 'advanced' : 'compact'); } catch { /* this view only */ }
    window.UPDOWN_CLIENT.view = adv ? 'advanced' : 'compact';
    mountXv(); draw();
  };
  // EVERY PRESS AND KEYSTROKE, from the view
  const on = {
    pick: (i) => { pick = i; draw(); },
    menu: () => { menuOpen = !menuOpen; draw(); },
    mode: (m) => { mode = m; menuOpen = false; if (m === 'limit') form.lp = String(priceOf(pick)); draw(); },
    input: (k, v) => { form[k] = v; if (k === 'amt') keepAmount(); draw(); },
    step: (dir) => {
      const v = Math.floor(Number(form.amt)) || 0;
      const next = dir > 0 ? v + stepAt(v) : v - stepAt(Math.max(1, v - 1));
      form.amt = String(Math.min(MAX_SAT, Math.max(MIN_SAT, next))); keepAmount(); draw();
    },
    add: (n) => { form.amt = String(Math.min(MAX_SAT, (Math.floor(Number(form.amt)) || 0) + n)); keepAmount(); draw(); },
    sh: (n) => { form.sh = String(Math.max(0, (Math.floor(Number(form.sh)) || 0) + n)); draw(); },
    lp: (n) => { form.lp = String(Math.min(99, Math.max(1, (Math.floor(Number(form.lp)) || 50) + n))); draw(); },
    cancel: async (id) => {
      cancelling.add(id); draw();
      const r = await A.market.cancel(id);
      cancelling.delete(id); said = r.ok ? '' : 'Cancel refused: ' + (r.why || (r.seats || []).map((s) => s.why).join('; ')); draw();
    },
    go: () => {
      const a = asked(); if (a.why) return;
      said = '';
      placing = { round: current.id, pick, limitCents: a.limitCents, stakeSat: a.stakeSat, entryCloseMs: current.entryCloseMs, at: Date.now(), doneAt: 0 };
      const ok = A.market.order(current.id, pick, a.limitCents * TICK, a.expiryMs, a.stakeSat * 1000);
      if (ok === false) { placing = null; said = 'The page did not take the order: ' + ((A.state().join || {}).why || 'no answer'); }
      draw();
      setTimeout(draw, 500);
    },
    view: (v) => setView(v),
    // the exchange's host, once React has made it: mounted after this draw
    xvHost: (el) => { xvEl = el; if (el) setTimeout(mountXv, 0); },
  };
  setView(adv ? 'advanced' : 'compact');
  prices(); readBook();
  setInterval(draw, 1000); setInterval(prices, 5000); setInterval(readBook, 3000);
  if (wide.addEventListener) wide.addEventListener('change', mountXv);
}
</script>
</body></html>
